[package]
name = "turn-store"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
eventsource-stream = "0.2"
futures-util = "0.3"
jiff = "0.2.23"
redis = {
  version = "1",
  features = ["connection-manager", "streams", "tokio-comp"]
}
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
toasty = { version = "0.7.0", features = ["postgresql", "jiff"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
uuid = { version = "1.12", features = ["serde"] }
