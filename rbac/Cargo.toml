[package]
name = "rbac"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
password-hash = { version = "0.5", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = {
  version = "0.9.0",
  features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid"
  ]
}
tokio = { version = "1", features = ["full"] }
tower = "0.5"
uuid = { version = "1.12", features = ["serde"] }

dotenvy = "0.15"
