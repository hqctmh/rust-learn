[package]
name = "post"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5.3", optional = true }
async-nats = { version = "0.49.1", optional = true }
aws-config = { version = "1.8.18", optional = true }
aws-sdk-s3 = { version = "1.135.0", optional = true }
axum = { version = "0.8", features = ["macros", "ws"], optional = true }
base64 = "0.22"
console_error_panic_hook = { version = "0.1", optional = true }
dotenvy = "0.15"
elasticsearch = { version = "9.1.0-alpha.1", optional = true }
leptos = { version = "0.8.0" }
leptos_axum = { version = "0.8.0", optional = true }
leptos_meta = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
redis = { version = "1.2.2", features = ["tokio-comp"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
send_wrapper = { version = "0.6.0", optional = true }
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "time", "uuid"], optional = true }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tower-http = { version = "0.6.11", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1.12", features = ["serde", "v4", "js"] }
wasm-bindgen = { version = "=0.2.105", optional = true }
web-sys = { version = "0.3.82", features = ["Blob", "Event", "File", "FileList", "FileReader", "HtmlInputElement", "Location", "MessageEvent", "WebSocket", "Window"], optional = true }

[dev-dependencies]
futures-util = "0.3"
pretty_assertions = "1.4"

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:send_wrapper",
    "dep:serde_json",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
ssr = [
    "dep:async-nats",
    "dep:argon2",
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:axum",
    "dep:elasticsearch",
    "dep:redis",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:leptos_axum",
    "dep:sqlx",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "post"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
